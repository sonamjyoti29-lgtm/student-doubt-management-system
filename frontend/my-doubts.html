<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Doubts - Student Doubt System</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="dashboard-navbar">

        <div class="dashboard-logo">

            <span>SD</span>

            Student Doubt System

        </div>


        <div class="dashboard-user">

            <span id="loggedUserName">
                Student
            </span>

            <a href="student-dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="dashboard-container">


        <!-- Page Heading -->

        <section class="dashboard-welcome">

            <div>

                <h1>
                    My Doubts
                </h1>

                <p>
                    View and track all the doubts you have submitted.
                </p>

            </div>


            <a href="ask-doubt.html" class="dashboard-primary-btn">
                + Ask a Doubt
            </a>

        </section>



        <!-- =========================================
             DOUBTS LIST
        ========================================== -->

        <section class="dashboard-card">


            <div class="card-heading">

                <div>

                    <h2>
                        Your Submitted Doubts
                    </h2>

                    <p>
                        Track the status of your questions.
                    </p>

                </div>

            </div>


            <!-- JavaScript will display doubts here -->

            <div id="myDoubtsList"></div>


        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="dashboard-footer">

        <p>
            © 2026 Student Doubt Management System
        </p>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =========================================
           GET LOGGED-IN USER
        ========================================== */

        const loggedInUser =
            JSON.parse(
                localStorage.getItem("sdLoggedInUser")
            );



        /* =========================================
           CHECK LOGIN
        ========================================== */

        if (!loggedInUser) {

            window.location.href = "login.html";

        }



        /* =========================================
           LOAD USER DATA
        ========================================== */

        if (loggedInUser) {


            /* -------------------------------------
               DISPLAY USER NAME
            ------------------------------------- */

            document.getElementById("loggedUserName").textContent =
                loggedInUser.name;



            /* =====================================
               GET ALL DOUBTS
            ====================================== */

            const allDoubts =
                JSON.parse(
                    localStorage.getItem("sdDoubts")
                ) || [];



            /* =====================================
               GET ONLY THIS USER'S DOUBTS
            ====================================== */

            const userDoubts =
                allDoubts.filter(function(doubt) {

                    return doubt.userEmail === loggedInUser.email;

                });



            /* =====================================
               DOUBT CONTAINER
            ====================================== */

            const myDoubtsList =
                document.getElementById("myDoubtsList");



            /* =====================================
               NO DOUBTS
            ====================================== */

            if (userDoubts.length === 0) {

                myDoubtsList.innerHTML = `

                    <div class="doubt-item">

                        <div class="doubt-info">

                            <h3>
                                No doubts submitted yet
                            </h3>

                            <p>
                                Click "Ask a Doubt" to submit your first question.
                            </p>

                        </div>

                    </div>

                `;

            }



            /* =====================================
               SHOW ALL USER DOUBTS
            ====================================== */

            else {


                /* Latest doubt first */

                const reversedDoubts =
                    userDoubts.slice().reverse();



                reversedDoubts.forEach(function(doubt) {


                    /* ---------------------------------
                       STATUS CLASS
                    --------------------------------- */

                    let statusClass =
                        "pending";


                    if (doubt.status === "Answered") {

                        statusClass =
                            "answered";

                    }



                    /* ---------------------------------
                       DISPLAY NAME
                    --------------------------------- */

                    let displayName =
                        doubt.studentName;


                    if (doubt.anonymous) {

                        displayName =
                            "Anonymous Student";

                    }



                    /* ---------------------------------
                       CREATE DOUBT CARD
                    --------------------------------- */

                    myDoubtsList.innerHTML += `

                        <div class="doubt-item">

                            <div class="doubt-info">

                                <h3>
                                    ${doubt.subject}
                                </h3>

                                <p>
                                    ${doubt.doubt}
                                </p>

                                <p style="margin-top: 7px; font-size: 12px;">

                                    Asked by: ${displayName}

                                </p>

                            </div>


                            <span class="status ${statusClass}">

                                ${doubt.status}

                            </span>

                        </div>

                    `;

                });

            }

        }

    </script>


</body>

</html>
